name: 官网构建与浏览器检查
on:
  push:
    paths: ['website/**', 'scripts/package-website.py', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'scripts/package-website.py', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ../scripts/package-website.py
      - uses: actions/upload-artifact@v4
        with:
          name: DotKnow-website
          path: website/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DotKnow-website-deployment
          path: downloads/DotKnow-Website.*
