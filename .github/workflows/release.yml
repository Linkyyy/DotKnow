name: 发布中文安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v0.3.0'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DotKnow.sln --locked-mode
      - name: 验证 Windows 核心测试
        shell: pwsh
        run: |
          dotnet test tests/DotKnow.Tests -c Release --no-restore --logger "trx;LogFileName=windows-core.trx" --results-directory artifacts/ui-smoke
          $testExit = $LASTEXITCODE
          if (Test-Path artifacts/ui-smoke/windows-core.trx) {
            [xml]$trx = Get-Content artifacts/ui-smoke/windows-core.trx -Raw
            $counter = $trx.SelectSingleNode("//*[local-name()='Counters']")
            "Windows 核心测试：总数 $($counter.total)，通过 $($counter.passed)，失败 $($counter.failed)" | Tee-Object -FilePath artifacts/ui-smoke/windows-core-results.txt
            $trx.SelectNodes("//*[local-name()='UnitTestResult'][@outcome='Failed']") | ForEach-Object {
              $message = $_.SelectSingleNode(".//*[local-name()='Message']").InnerText
              Write-Host "::error::$($_.testName)：$message"
              "$($_.testName)：$message" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          exit $testExit
      - name: 验证真实 WPF 与跨进程选区
        timeout-minutes: 3
        run: dotnet run --project tools/DotKnow.UiSmoke -c Release --no-restore -- artifacts/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: artifacts/ui-smoke/
      - name: 保存界面验证摘要
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/ui-smoke/*.txt | ForEach-Object {
            Get-Content $_.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: 检查安装包与源码包校验值
        shell: pwsh
        run: |
          Get-Content downloads/SHA256SUMS.txt | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $actual = (Get-FileHash (Join-Path downloads $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "下载文件校验失败：$($parts[1])" }
          }
      - name: 上传 GitHub Release 附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$') { throw '版本标签格式无效' }
          $files = @('downloads/DotKnow-Windows-x64.zip', 'downloads/DotKnow-Source.zip', 'downloads/SHA256SUMS.txt')
          $files += @(Get-ChildItem artifacts/ui-smoke/*.png, artifacts/ui-smoke/*.txt, artifacts/ui-smoke/*.trx | ForEach-Object { $_.FullName })
          $extra = @()
          if ($env:RELEASE_TAG.Contains('-')) { $extra += '--prerelease' }
          gh release create $env:RELEASE_TAG @files --verify-tag --title "点解 DotKnow $env:RELEASE_TAG 中文版" --notes-file docs/RELEASE_NOTES.md @extra
          if ($LASTEXITCODE -ne 0) { throw 'GitHub 版本附件上传失败' }
