name: 发布中文安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v0.2.0'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  ui-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TypeLingo.sln --locked-mode
      - run: dotnet run --project tools/TypeLingo.UiSmoke -c Release --no-restore -- artifacts/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: artifacts/ui-smoke/
      - name: 保存界面验证摘要
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/ui-smoke/*.txt | ForEach-Object {
            Get-Content $_.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
  release:
    needs: ui-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-smoke
          path: artifacts/ui-smoke
      - name: 检查安装包与源码包校验值
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
      - name: 上传 GitHub Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo '版本标签格式无效，请使用 v0.2.0 这样的版本号。'
            exit 1
          fi
          EXTRA=()
          if [[ "$RELEASE_TAG" == *-* ]]; then EXTRA+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            downloads/TypeLingo-Windows-x64.zip \
            downloads/TypeLingo-Source.zip \
            downloads/SHA256SUMS.txt \
            artifacts/ui-smoke/*.png \
            artifacts/ui-smoke/*.txt \
            --verify-tag \
            --title "TypeLingo（伴译）$RELEASE_TAG 中文版" \
            --notes-file docs/RELEASE_NOTES.md "${EXTRA[@]}"
