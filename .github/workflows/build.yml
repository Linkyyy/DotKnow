name: 构建与测试
on:
  push:
    branches-ignore: ['codex/ui-preview-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TypeLingo.sln --locked-mode
      - run: dotnet build TypeLingo.sln -c Release --no-restore
      - run: dotnet test tests/TypeLingo.Tests -c Release --no-build --logger trx
      - name: 打包宣传图和文案
        run: python3 scripts/package-promotion.py
      - uses: actions/upload-artifact@v4
        with:
          name: DotKnow-promotion
          path: artifacts/DotKnow-Promotion.*
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TypeLingo.sln --locked-mode
      - run: dotnet build TypeLingo.sln -c Release --no-restore
      - run: dotnet test tests/TypeLingo.Tests -c Release --no-build --logger trx
      - run: ./scripts/publish-windows.ps1
      - name: 运行真实 WPF 设置窗口验证
        id: ui_smoke
        timeout-minutes: 5
        run: dotnet run --project tools/TypeLingo.UiSmoke -c Release --no-build -- artifacts/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TypeLingo-settings-ui
          path: artifacts/ui-smoke/
      - name: 发布界面预览与验收诊断
        if: always() && steps.ui_smoke.outcome != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/codex/typelingo-favorites-and-replacement'
        run: ./scripts/publish-ui-previews.ps1
      - run: python scripts/package-release.py
      - name: 验证点知安装包与程序启动
        run: ./scripts/test-release-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DotKnow-win-x64
          path: artifacts/*.zip
