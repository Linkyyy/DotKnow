name: 构建与测试
on:
  push:
    branches-ignore: ['codex/ui-preview-*', 'codex/release-preview-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DotKnow.sln --locked-mode
      - run: dotnet build DotKnow.sln -c Release --no-restore
      - run: dotnet test tests/DotKnow.Tests -c Release --no-build --logger trx
      - name: 打包宣传图和文案
        run: python3 scripts/package-promotion.py
      - uses: actions/upload-artifact@v4
        with:
          name: DotKnow-promotion
          path: artifacts/DotKnow-Promotion.*
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DotKnow.sln --locked-mode
      - run: dotnet build DotKnow.sln -c Release --no-restore
      - run: dotnet test tests/DotKnow.Tests -c Release --no-build --logger trx
      - run: ./scripts/publish-windows.ps1
      - name: 运行真实 WPF 设置窗口验证
        id: ui_smoke
        timeout-minutes: 5
        run: dotnet run --project tools/DotKnow.UiSmoke -c Release --no-build -- artifacts/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DotKnow-settings-ui
          path: artifacts/ui-smoke/
      - name: 发布界面预览与验收诊断
        if: always() && steps.ui_smoke.outcome != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/codex/typelingo-favorites-and-replacement'
        run: ./scripts/publish-ui-previews.ps1
      - name: 同步本次验收截图到安装包与宣传素材
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/ui-preview | Out-Null
          Copy-Item artifacts/ui-smoke/*.png, artifacts/ui-smoke/*.txt docs/ui-preview -Force
          Copy-Item artifacts/ui-smoke/assistant-encyclopedia.png docs/promotion/app-assistant.png -Force
          Copy-Item artifacts/ui-smoke/settings-prompts.png docs/promotion/app-prompts.png -Force
          @{ source_commit = $env:GITHUB_SHA; workflow_run = $env:GITHUB_RUN_ID; passed = $true; captured_on = 'Windows GitHub Actions'; data = 'isolated UI fixtures; no user data' } |
            ConvertTo-Json | Set-Content docs/ui-preview/source.json -Encoding utf8
      - run: python scripts/package-promotion.py
      - run: python scripts/package-release.py
      - name: 验证点知安装包与程序启动
        run: ./scripts/test-release-package.ps1
      - name: 发布 Windows 验收安装包
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/typelingo-favorites-and-replacement'
        run: ./scripts/publish-release-previews.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DotKnow-win-x64
          path: artifacts/*.zip
