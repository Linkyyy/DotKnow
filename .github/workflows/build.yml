name: 构建与测试
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TypeLingo.sln --locked-mode
      - run: dotnet build TypeLingo.sln -c Release --no-restore
      - run: dotnet test tests/TypeLingo.Tests -c Release --no-build --logger trx
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TypeLingo.sln --locked-mode
      - run: dotnet build TypeLingo.sln -c Release --no-restore
      - run: dotnet test tests/TypeLingo.Tests -c Release --no-build --logger trx
      - run: ./scripts/publish-windows.ps1
      - run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: TypeLingo-win-x64
          path: artifacts/*.zip
